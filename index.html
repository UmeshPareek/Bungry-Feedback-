<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bungry's | Premium Feedback</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDEdJvhB2uQhpryYN8aPdtPhzSjZRwMdOI",
          authDomain: "bungry-feedback.firebaseapp.com",
          projectId: "bungry-feedback",
          storageBucket: "bungry-feedback.firebasestorage.app",
          messagingSenderId: "310738946338",
          appId: "1:310738946338:web:42d31e01c98a85d7e57d7b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.handleSubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const formCard = document.getElementById('form-card');
            const successState = document.getElementById('success-state');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> SECURING YOUR FEEDBACK...';

            const review = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                mobile: document.getElementById('mobile').value,
                profession: document.getElementById('profession').value,
                location: document.getElementById('location').value,
                rating: document.getElementById('rating').value,
                community: document.getElementById('community').checked ? "YES" : "NO",
                timestamp: new Date().toISOString()
            };

            try {
                await addDoc(collection(db, "reviews"), review);
                // Premium Transition
                formCard.style.opacity = '0';
                setTimeout(() => {
                    formCard.classList.add('hidden');
                    successState.classList.remove('hidden');
                    successState.style.opacity = '1';
                }, 400);
            } catch (err) {
                console.error(err);
                alert("Submission failed. Check your connection.");
                btn.disabled = false;
                btn.innerText = "RETRY SUBMISSION";
            }
        };

        window.downloadCSV = async () => {
            const btn = document.getElementById('dlBtn');
            btn.innerHTML = "PREPARING BATCH...";
            const q = query(collection(db, "reviews"), orderBy("timestamp", "desc"));
            const snapshot = await getDocs(q);
            const data = snapshot.docs.map(doc => doc.data());
            if (data.length === 0) return alert("No data found.");
            
            const headers = ["Timestamp", "Name", "Email", "Mobile", "Profession", "Location", "Rating", "Community"];
            const csvRows = [headers.join(","), ...data.map(r => [r.timestamp, `"${r.name}"`, r.email, r.mobile, `"${r.profession}"`, `"${r.location}"`, r.rating, r.community].join(","))];
            
            const blob = new Blob([csvRows.join("\n")], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Bungrys_Data_${new Date().toLocaleDateString()}.csv`;
            a.click();
            btn.innerHTML = "📥 DOWNLOAD CSV";
        };
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .premium-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.5s ease; }
        .bungry-gradient { background: linear-gradient(135deg, #FFB800 0%, #FF4E00 100%); }
        .input-premium { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: white; transition: 0.3s; }
        .input-premium:focus { border-color: #FF4E00; background: rgba(255, 255, 255, 0.08); box-shadow: 0 0 20px rgba(255, 78, 0, 0.2); }
        .btn-submit { background: linear-gradient(to right, #FF4E00, #ec4899); text-transform: uppercase; letter-spacing: 2px; font-weight: 900; transition: 0.3s; }
        .btn-submit:hover { transform: scale(1.02); filter: brightness(1.1); }
    </style>
</head>
<body class="text-white selection:bg-orange-500">

    <div class="min-h-screen flex flex-col items-center justify-center p-6 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-orange-900/20 via-slate-900 to-black">
        
        <div class="mb-10 text-center animate-fade-in">
            <img src="Bungry's Logo.jpg" alt="Bungry's" class="h-28 mx-auto drop-shadow-[0_0_30px_rgba(255,184,0,0.3)]">
            <div class="mt-4 px-4 py-1 rounded-full bg-white/5 border border-white/10 inline-block">
                <span class="text-[10px] font-black tracking-[0.4em] uppercase text-orange-400">The Street Smart Burgers</span>
            </div>
        </div>

        <div id="form-card" class="premium-card w-full max-w-lg rounded-[2.5rem] p-1 shadow-2xl overflow-hidden">
            <div class="bg-white/5 p-8 md:p-10 space-y-6">
                <div class="text-center space-y-2">
                    <h1 class="text-4xl font-black italic tracking-tighter uppercase">Rate Your Bite</h1>
                    <p class="text-slate-400 text-sm font-medium uppercase tracking-widest">Help us fuel the gully</p>
                </div>

                <form onsubmit="handleSubmit(event)" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="name" placeholder="Full Name" required class="input-premium p-4 rounded-2xl outline-none">
                        <input type="tel" id="mobile" placeholder="WhatsApp (10 Digits)" pattern="[0-9]{10}" required class="input-premium p-4 rounded-2xl outline-none">
                    </div>
                    <input type="email" id="email" placeholder="Email Address" required class="input-premium w-full p-4 rounded-2xl outline-none">
                    
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" id="profession" placeholder="Profession" class="input-premium p-4 rounded-2xl outline-none text-sm">
                        <input type="text" id="location" placeholder="Location" class="input-premium p-4 rounded-2xl outline-none text-sm">
                    </div>

                    <div class="bg-white/5 p-6 rounded-3xl border border-white/10">
                        <label class="block text-center text-[10px] font-black text-slate-500 mb-4 uppercase tracking-[0.2em]">Quality Score</label>
                        <select id="rating" class="w-full bg-transparent text-center font-black text-2xl text-orange-500 outline-none appearance-none cursor-pointer">
                            <option value="5">🔥🔥🔥🔥🔥 5/5</option>
                            <option value="4">⭐⭐⭐⭐ 4/5</option>
                            <option value="3">⭐⭐⭐ 3/5</option>
                            <option value="2">⭐⭐ 2/5</option>
                            <option value="1">⭐ 1/5</option>
                        </select>
                    </div>

                    <label class="flex items-center gap-4 bg-white/5 p-5 rounded-3xl border border-white/5 cursor-pointer hover:bg-white/10 transition">
                        <input type="checkbox" id="community" class="w-6 h-6 rounded-lg accent-orange-600">
                        <span class="text-[11px] font-bold text-slate-300 uppercase leading-tight">Join Bungry's Inner Circle for Secret Launches! 🚀</span>
                    </label>

                    <button type="submit" id="submitBtn" class="btn-submit w-full py-5 rounded-2xl text-white shadow-[0_10px_30px_rgba(255,78,0,0.3)]">
                        Submit Feedback
                    </button>
                </form>
            </div>
        </div>

        <div id="success-state" class="hidden opacity-0 transition-opacity duration-500 text-center premium-card max-w-md p-12 rounded-[3rem]">
            <div class="w-24 h-24 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-6 border border-green-500/30">
                <i class="fas fa-check text-4xl text-green-500 animate-bounce"></i>
            </div>
            <h2 class="text-4xl font-black italic uppercase italic tracking-tighter mb-4 text-white">SUBMITTED!</h2>
            <p class="text-slate-400 font-bold text-sm uppercase tracking-wide leading-relaxed">Your review is in the system. <br>Stay Street Smart.</p>
            <button onclick="location.reload()" class="mt-8 text-[10px] font-black uppercase tracking-[0.3em] text-orange-500 underline underline-offset-8">Submit Another</button>
        </div>

        <button onclick="let p=prompt('PIN:'); if(p==='2000') document.getElementById('admin-modal').classList.remove('hidden')" class="mt-12 text-[10px] font-black text-white/20 tracking-[0.5em] uppercase hover:text-orange-500 transition">
            — System Dashboard —
        </button>

        <div id="admin-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-6 z-50 backdrop-blur-xl">
            <div class="premium-card p-10 w-full max-w-sm text-center rounded-[3rem]">
                <h3 class="text-2xl font-black mb-8 uppercase italic italic tracking-tighter">Admin Portal</h3>
                <button id="dlBtn" onclick="downloadCSV()" class="w-full bg-green-600 text-white font-black py-5 rounded-2xl shadow-xl hover:bg-green-700 transition-all mb-4 tracking-widest uppercase text-xs">
                    📥 DOWNLOAD DATA (CSV)
                </button>
                <button onclick="document.getElementById('admin-modal').classList.add('hidden')" class="text-slate-500 text-[10px] font-black uppercase tracking-widest mt-4">Close Connection</button>
            </div>
        </div>
    </div>
</body>
</html>
