<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bungry's | Premium Feedback</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDEdJvhB2uQhpryYN8aPdtPhzSjZRwMdOI",
          authDomain: "bungry-feedback.firebaseapp.com",
          projectId: "bungry-feedback",
          storageBucket: "bungry-feedback.firebasestorage.app",
          messagingSenderId: "310738946338",
          appId: "1:310738946338:web:42d31e01c98a85d7e57d7b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.handleSubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const formCard = document.getElementById('form-card');
            const successState = document.getElementById('success-state');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> GRILLING...';

            const review = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                mobile: document.getElementById('mobile').value,
                profession: document.getElementById('profession').value,
                location: document.getElementById('location').value,
                rating: document.getElementById('rating').value,
                community: document.getElementById('community').checked ? "YES" : "NO",
                timestamp: new Date().toISOString()
            };

            try {
                // The 'await' ensures we wait for Firebase to confirm the save
                await addDoc(collection(db, "reviews"), review);
                
                formCard.classList.add('opacity-0');
                setTimeout(() => {
                    formCard.classList.add('hidden');
                    successState.classList.remove('hidden');
                    setTimeout(() => successState.classList.add('opacity-100'), 50);
                }, 400);
            } catch (err) {
                console.error("Firestore Error:", err);
                alert("STALL ERROR: Make sure your Firestore Rules are set to 'Test Mode'!");
                btn.disabled = false;
                btn.innerText = "RETRY SUBMISSION";
            }
        };

        window.downloadCSV = async () => {
            const btn = document.getElementById('dlBtn');
            btn.innerHTML = "FETCHING DATABASE...";
            try {
                const q = query(collection(db, "reviews"), orderBy("timestamp", "desc"));
                const snapshot = await getDocs(q);
                const data = snapshot.docs.map(doc => doc.data());
                
                const headers = ["Timestamp", "Name", "Email", "Mobile", "Profession", "Location", "Rating", "Community"];
                const csvRows = [headers.join(","), ...data.map(r => [r.timestamp, `"${r.name}"`, r.email, r.mobile, `"${r.profession || ''}"`, `"${r.location || ''}"`, r.rating, r.community].join(","))];
                
                const blob = new Blob([csvRows.join("\n")], { type: 'text/csv' });
                window.open(URL.createObjectURL(blob));
            } catch (e) { alert("Download Failed"); }
            btn.innerHTML = "📥 DOWNLOAD CSV";
        };
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050505; }
        .logo-font { font-family: 'Syncopate', sans-serif; }
        .premium-glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .input-glow:focus { border-color: #FF4E00; box-shadow: 0 0 15px rgba(255, 78, 0, 0.3); }
        .btn-fire { background: linear-gradient(90deg, #FFB800, #FF4E00); transition: 0.4s; }
        .btn-fire:hover { filter: brightness(1.2); transform: translateY(-2px); }
        .fade-in { transition: opacity 0.5s ease-in-out; }
    </style>
</head>
<body class="text-white">

    <div class="min-h-screen flex flex-col items-center justify-center p-6 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-orange-900/10 via-black to-black">
        
        <div class="mb-8 text-center">
            <img src="Bungry's Logo.jpg" alt="Bungry's" class="h-28 mx-auto drop-shadow-[0_0_40px_rgba(255,78,0,0.4)]">
            <p class="text-[9px] logo-font tracking-[0.5em] uppercase mt-4 text-orange-500 opacity-80">The Street Smart Burgers</p>
        </div>

        <div id="form-card" class="premium-glass w-full max-w-lg rounded-[2.5rem] p-8 md:p-10 fade-in shadow-2xl">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-black italic uppercase tracking-tighter italic">Drop a Review ⚡</h1>
            </div>

            <form onsubmit="handleSubmit(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="name" placeholder="Full Name" required class="input-glow w-full p-4 bg-white/5 rounded-2xl outline-none border border-white/10">
                    <input type="tel" id="mobile" placeholder="WhatsApp (10 Digits)" pattern="[0-9]{10}" required class="input-glow w-full p-4 bg-white/5 rounded-2xl outline-none border border-white/10">
                </div>
                <input type="email" id="email" placeholder="Email Address" required class="input-glow w-full p-4 bg-white/5 rounded-2xl outline-none border border-white/10">
                
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="profession" placeholder="Profession" class="input-glow w-full p-4 bg-white/5 rounded-2xl outline-none border border-white/10 text-sm">
                    <input type="text" id="location" placeholder="Location" class="input-glow w-full p-4 bg-white/5 rounded-2xl outline-none border border-white/10 text-sm">
                </div>

                <div class="bg-white/5 p-6 rounded-3xl border border-white/10 text-center">
                    <label class="block text-[10px] font-black text-gray-500 mb-3 uppercase tracking-widest">Rate the Experience</label>
                    <select id="rating" class="w-full bg-transparent font-black text-2xl text-orange-500 outline-none text-center appearance-none">
                        <option value="5">🔥🔥🔥🔥🔥 (5/5)</option>
                        <option value="4">✨✨✨✨ (4/5)</option>
                        <option value="3">🍔🍔🍔 (3/5)</option>
                        <option value="2">⚖️⚖️ (2/5)</option>
                        <option value="1">💀 (1/5)</option>
                    </select>
                </div>

                <label class="flex items-center gap-4 bg-white/5 p-5 rounded-3xl border border-white/5 cursor-pointer">
                    <input type="checkbox" id="community" class="w-6 h-6 rounded-lg accent-orange-500">
                    <span class="text-[10px] font-bold text-gray-400 uppercase leading-tight">Join the Inner Circle for Secret Launches! 💎</span>
                </label>

                <button type="submit" id="submitBtn" class="btn-fire w-full py-5 rounded-2xl text-black font-black uppercase tracking-[0.2em] shadow-lg">
                    Confirm Review
                </button>
            </form>
        </div>

        <div id="success-state" class="hidden opacity-0 transition-all duration-700 text-center premium-glass max-w-md p-14 rounded-[3rem] shadow-[0_0_50px_rgba(34,197,94,0.1)]">
            <div class="text-7xl mb-6">👑</div>
            <h2 class="text-4xl font-black italic uppercase italic tracking-tighter text-white mb-2">LEGEND!</h2>
            <p class="text-gray-400 font-bold text-xs uppercase tracking-widest">Your feedback is locked in the system.</p>
            <button onclick="location.reload()" class="mt-10 text-[10px] font-black uppercase tracking-[0.4em] text-orange-500 underline underline-offset-8">Submit Another</button>
        </div>

        <button onclick="let p=prompt('PIN:'); if(p==='2000') document.getElementById('admin-modal').classList.remove('hidden')" class="mt-12 text-[9px] font-black text-white/10 tracking-[0.5em] uppercase hover:text-orange-500 transition-all">
            — Bungry System Dash —
        </button>

        <div id="admin-modal" class="hidden fixed inset-0 bg-black/98 flex items-center justify-center p-6 z-50">
            <div class="premium-glass p-10 w-full max-w-sm text-center rounded-[3rem]">
                <h3 class="text-xl font-black mb-8 uppercase italic tracking-widest">Master Portal</h3>
                <button id="dlBtn" onclick="downloadCSV()" class="w-full bg-orange-600 text-white font-black py-5 rounded-2xl mb-4 tracking-widest uppercase text-xs">
                    📥 DOWNLOAD CSV
                </button>
                <button onclick="document.getElementById('admin-modal').classList.add('hidden')" class="text-gray-600 text-[10px] font-black uppercase tracking-widest">Close Access</button>
            </div>
        </div>
    </div>
</body>
</html>
